<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chart Example</title>
<style>
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <canvas id="ageChart" aria-label="Age distribution of patients" role="img"></canvas>
  <span class="visually-hidden">This chart shows patient distribution by age groups.</span>

  <canvas id="bedChart" aria-label="Hospital bed availability" role="img"></canvas>
  <span class="visually-hidden">This chart visualizes the availability of hospital beds.</span>
</body>
</html>
